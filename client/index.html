<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/png" href="/logo All Star.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#5DADE2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="ALL STAR" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ALL STAR TEAM - Bowling Association</title>
  <style>
    vercel-live-feedback,
    #vercel-toolbar,
    [data-vercel-toolbar] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
  <script>
    // Blocca intercettazione tasti negli input (es: AltGr + @ per la chiocciola)
    window.addEventListener('keydown', function(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
        e.stopPropagation();
      }
    }, true);
    // Elimina cookie residui della toolbar
    try {
      document.cookie = "_vercel_toolbar=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;";
      document.cookie = "__vercel_toolbar=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;";
    } catch(err) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
